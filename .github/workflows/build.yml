name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q -o minecraft_manager.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash setup.sh
        working-directory: minecraft_manager
      - run: flutter build apk --release
        working-directory: minecraft_manager
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: minecraft_manager/build/app/outputs/flutter-apk/app-release.apk


          
