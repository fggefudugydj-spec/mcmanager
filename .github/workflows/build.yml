name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip newest zip
        run: |
          f=$(git log --format= --name-only --diff-filter=AM -- '*.zip' | grep -m1 .)
          echo "Using: $f"
          unzip -q -o "$f" -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build
        run: |
          d=$(dirname "$(find src -name settings.gradle.kts | head -1)")
          cd "$d"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MCVersionManager-apk
          path: src/**/app-debug.apk
